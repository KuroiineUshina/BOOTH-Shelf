name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify tag matches project version
        run: npm run verify:version -- "$GITHUB_REF_NAME"

      - name: Build installation ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/booth-shelf"
          archive="dist/booth-shelf-${GITHUB_REF_NAME}.zip"
          mkdir -p "$package_dir"
          cp manifest.json background.js dashboard.html styles.css LICENSE README.md PRIVACY.md "$package_dir/"
          cp -R assets src "$package_dir/"
          (
            cd dist
            zip -rq "$(basename "$archive")" booth-shelf
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/booth-shelf-${GITHUB_REF_NAME}.zip" \
            "dist/booth-shelf-${GITHUB_REF_NAME}.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "BOOTH Shelf ${GITHUB_REF_NAME}"
